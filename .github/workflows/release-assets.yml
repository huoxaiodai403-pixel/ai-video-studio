name: Build release downloads

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        default: v0.3.0
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read the tagged source with repository-scoped access
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" source -- --depth 1 --branch "$RELEASE_TAG"
          test "v$(cat source/VERSION | tr -d '\r\n')" = "$RELEASE_TAG"
          edition="$(cat source/EDITION | tr -d '\r\n')"
          if [[ "$edition" == development ]]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          elif [[ "$edition" != friend ]]; then
            echo "Unknown source edition" >&2; exit 1
          fi
      - name: Build and verify source-only archives
        shell: bash
        run: |
          set -euo pipefail
          python3 source/packaging/build_release.py
          cd source/dist
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload downloadable release assets
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            notes="source/docs/releases/$RELEASE_TAG.md"
            if [[ -f "$notes" ]]; then
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG · AI 视频工作台 ($(cat source/EDITION))" --notes-file "$notes"
            else
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG · AI 视频工作台 ($(cat source/EDITION))" --generate-notes
            fi
          fi
          gh release upload "$RELEASE_TAG" source/dist/*.zip source/dist/SHA256SUMS.txt source/dist/release-manifest.json --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
