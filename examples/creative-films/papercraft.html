<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#f3edde}canvas{display:block}</style></head><body><canvas width="720" height="1280"></canvas>
<!-- CREATIVE_FILM -->
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),E=Film.ease;
function poly(points,color,shadow=true){g.save();g.fillStyle=color;if(shadow){g.shadowColor='#88735d32';g.shadowBlur=7;g.shadowOffsetX=5;g.shadowOffsetY=8;}g.beginPath();points.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fill();g.restore();}
function line(points,color='#bbab90',w=2){g.strokeStyle=color;g.lineWidth=w;g.beginPath();points.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();}
function rabbit(x,y,s,t,wave){g.save();g.translate(x,y);g.scale(s,s);poly([[-80,25],[-98,-65],[-60,-140],[58,-140],[98,-65],[80,25]],'#fff8e5');poly([[-72,-113],[-90,-280],[-44,-268],[-28,-135]],'#fff6df');poly([[30,-133],[48,-282],[89,-265],[74,-111]],'#fff6df');poly([[-71,-145],[-78,-253],[-56,-245],[-45,-145]],'#eebeb0',false);poly([[46,-146],[58,-251],[77,-245],[62,-145]],'#eebeb0',false);poly([[-65,10],[-110,132],[98,132],[64,12]],'#9dbeba');line([[-65,12],[0,84],[64,12]],'#6e9c98');line([[0,84],[0,130]],'#6e9c98');g.fillStyle='#38454a';for(const xx of [-36,36]){g.beginPath();g.ellipse(xx,-69,5,9,0,0,7);g.fill();}poly([[-9,-43],[9,-43],[0,-32]],'#c5796d',false);g.fillStyle='#edb5a4';g.beginPath();g.ellipse(-58,-40,15,7,0,0,7);g.ellipse(58,-40,15,7,0,0,7);g.fill();g.save();g.translate(76,32);g.rotate(wave?-.65+Math.sin(t*4)*.24:.4);poly([[0,0],[88,6],[95,36],[-2,30]],'#a8cac4');g.restore();poly([[-102,32],[-154,91],[-126,113],[-68,67]],'#a8cac4');g.restore();}
function star(x,y,size,rot,color){g.save();g.translate(x,y);g.rotate(rot);let p=[];for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,r=i%2?size*.45:size;p.push([Math.cos(a)*r,Math.sin(a)*r]);}poly(p,color);g.restore();}
function cake(x,y,scale){g.save();g.translate(x,y);g.scale(scale,scale);poly([[-135,75],[-135,-36],[135,-36],[135,75]],'#ecc1ab');poly([[-135,-36],[-100,-78],[163,-78],[135,-36]],'#fff8e8');poly([[135,-36],[163,-78],[163,27],[135,75]],'#d5a18c');poly([[-40,-77],[-40,-178],[-19,-178],[-19,-77]],'#a6bdc8');poly([[40,-77],[40,-159],[60,-159],[60,-77]],'#de9388');star(-30,-202,17,0,'#e3bd66');star(50,-180,17,.2,'#e3bd66');g.restore();}
window.renderFrame=function(time){const z=Film.shot(time),p=E(z.progress),t=Math.floor(time*12.5)/12.5;g.fillStyle='#f4ecdc';g.fillRect(0,0,720,1280);g.fillStyle='#a1886511';for(let i=0;i<210;i++)g.fillRect((i*137)%720,(i*263)%1280,2,1);Film.text(g,'一张纸的祝福',360,94,24,'#887c68','center',500);
if(z.index===0){Film.text(g,'有一份惊喜',360,217,49,'#354d50','center');const a=E(z.local/1.3);poly([[150,890],[360,650-130*a],[570,890]],'#dac8a6');rabbit(360,850-210*a,.9,t,true);poly([[145,790],[575,790],[575,1030],[145,1030]],'#e9d9ba');poly([[145,790],[360,943],[575,790]],'#f5e8cc');line([[145,1030],[325,892]]);line([[575,1030],[395,892]]);}
if(z.index===1){Film.text(g,'生日快乐',360,214,66,'#354d50','center');rabbit(275,730,.8,t,true);cake(380+200*(1-E(z.local/1.2)),932,1.1);for(let i=0;i<11;i++)star(75+(i*91)%590,330+((t*37+i*69)%260),10+i%3*4,t*.2+i,['#ddb866','#bdcfc6','#dc9a8b'][i%3]);}
if(z.index===2){Film.text(g,'好好照顾自己',360,212,47,'#354d50','center');rabbit(358,695,.85,t,false);if(p<.48){poly([[190,827],[535,827],[475,961],[240,961]],'#d5a58e');poly([[217,818],[278,781],[345,797],[414,773],[510,817]],'#fff9e7');line([[190,832],[535,832]],'#8f7463',4);}else{poly([[169,887],[570,887],[570,1000],[169,1000]],'#96b6bb');poly([[169,847],[296,847],[296,889],[169,889]],'#fff6e4');g.save();g.translate(495,492);g.fillStyle='#e9c87b';g.beginPath();g.arc(0,0,50,0,7);g.fill();g.fillStyle='#f4ecdc';g.beginPath();g.arc(24,-15,45,0,7);g.fill();g.restore();}}
if(z.index===3){Film.text(g,'慢慢长大',360,207,58,'#354d50','center');Film.text(g,'勇敢出发',360,286,58,'#354d50','center');rabbit(360,779,.95,t,false);const q=.8+.2*E(z.local);g.save();g.translate(360,900);g.scale(q,q);poly([[0,77],[-95,-5],[-93,-70],[-40,-97],[0,-59],[40,-97],[93,-70],[95,-5]],'#d99082');line([[0,-55],[0,70]],'#b87569');g.restore();star(159,543,30,-.18,'#d9b569');star(581,649,25,.25,'#b2c6be');}
Film.caption(g,time,720,1280);};
</script></body></html>
