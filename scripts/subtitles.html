<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>语音转字幕 · AI 视频工作台</title>
<link rel="stylesheet" href="/assets/controls.css"><link rel="stylesheet" href="/assets/workbench.css"><link rel="stylesheet" href="/assets/tool-workspace.css"></head>
<body class="tool-page subtitles-page" data-tool="subtitles"><main><header class="tool-heading"><div><h1>语音转字幕</h1><p>从已有音视频提取字幕，保留可校对的文字与时间轴。</p></div><a href="/library">全部作品 →</a></header>
<div class="tool-layout"><section class="tool-panel" aria-labelledby="input-heading"><div class="panel-heading"><h2 id="input-heading">选择音视频</h2><p id="draft-state" class="draft-state" role="status">正在读取草稿…</p></div><form id="tool-form"><div class="compact-row"><label>从资源库选择<select id="source-library"><option value="">正在读取素材…</option></select></label><button id="refresh-source" class="secondary" type="button">刷新</button></div><p id="source-status" class="small" role="status"></p><label>音视频文件完整路径<input id="audio" required placeholder="例如 D:/素材/旁白.wav"></label><div id="source-preview" class="source-preview" hidden></div><p class="small">支持 WAV、MP3、FLAC、M4A 或 MP4。原文件保留。</p><div class="tool-source"><label>识别来源<select id="backend"><option value="local">本地 Qwen3-ASR</option><option value="online">在线识别 · 按服务商计费</option></select></label></div><div class="tool-submit"><button id="submit" type="submit" disabled class="primary">识别并生成字幕</button><p id="output-summary" class="small">输出 SRT 字幕与识别正文</p></div><p id="result" class="tool-feedback" role="status"></p><p id="action-help" class="small" hidden></p><details class="tool-details"><summary>识别与校对提示</summary><div class="detail-content"><p class="small">清晰人声通常有更好的识别效果。完成后核对专有名词、断句与时间轴；需要修改或烧录字幕时，进入剪辑工作台。</p><a href="/settings?service=asr">配置在线语音识别 →</a><a href="/video-tools?skill=agent-caption">在剪辑工作台调整字幕 →</a></div></details></form></section>
<section class="tool-panel tool-result" id="current-result" tabindex="-1" aria-labelledby="result-heading"><div class="panel-heading"><h2 id="result-heading">当前字幕</h2><span id="job-state" class="job-state" role="status">等待生成</span></div><p id="job-origin"></p><div class="result-surface"><div id="job-media"></div><p id="job-empty"></p></div><div id="job-actions"></div><p id="job-error" role="status"></p><p id="job-note" role="status"></p><p id="job-poll-status" role="status"></p><div class="job-footer"><p class="small">下载 SRT 后，可以在剪辑工作台修改或烧录字幕。</p><div class="result-history"><label>近期任务<select id="job-history" aria-label="近期任务"></select></label><a href="/library?status=all">全部作品 →</a></div><span id="job-id"></span></div></section></div></main>
<script src="/assets/creation.js"></script><script src="/assets/tool-draft-state.js"></script><script src="/assets/tool-workspace.js"></script><script src="/assets/media-tool.js"></script><script src="/assets/workbench.js"></script></body></html>
