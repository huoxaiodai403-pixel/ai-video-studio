<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>语音转字幕 · 本地工作台</title><style>body{font:16px system-ui;background:#111820;color:#edf3fa;margin:0}main{max-width:1250px;margin:auto;padding:32px}h1{margin-bottom:6px}p{color:#a6b6c8}section{background:#1a2633;border:1px solid #344456;border-radius:12px;padding:22px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1.25fr;gap:22px}input,textarea,select,button{font:inherit;border-radius:7px;border:1px solid #4f667b;padding:10px;box-sizing:border-box}input,textarea,select{width:100%;background:#101a24;color:white;margin:7px 0 14px}textarea{min-height:120px}button{background:#82dbc5;color:#10201d;cursor:pointer;margin:5px 5px 5px 0}.case{display:block;width:100%;text-align:left;background:#24384b;color:white}.list{max-height:430px;overflow:auto}a{color:#85d9fb}.small{font-size:13px;color:#a6b6c8}img{max-width:100%;border-radius:8px}pre{white-space:pre-wrap}@media(max-width:800px){.grid{grid-template-columns:1fr}}video{width:100%;max-height:420px}nav{line-height:2.2}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}</style><link rel="stylesheet" href="/assets/workbench.css"><main><h1>语音转字幕</h1><p>将本机音频识别为文字，并导出带时间戳的字幕。</p><nav aria-label="工作台导航"><a href="/">插画与提示词</a> · <a href="/production">视频制作</a> · <a href="/motion">动态镜头</a> · <a href="/subtitles">语音转字幕</a> · <a href="http://127.0.0.1:8188" target="_blank" rel="noopener">ComfyUI</a> · <a href="/speech">音色克隆与配音</a> · <a href="/plan" target="_blank">部署方案</a> · <a href="/research" target="_blank">文章与项目参考</a> · <a href="/guide" target="_blank">使用说明</a> · <a href="/settings">在线接口设置</a></nav><p id="services" hidden>检查服务状态…</p>
<section><h2>识别音频</h2><label>模型来源<select id="backend"><option value="local">本地模型</option><option value="online">在线模型 · 按配置厂商计费</option></select></label><p>复制音频的完整路径，提交后生成独立的文字和字幕文件。原音频不会覆盖。</p><label>音频完整路径<input id="audio" placeholder="D:/音频/旁白.wav"></label><button id="submit">开始识别并对齐</button><p id="result" role="status"></p></section><section><h2>识别任务</h2><div id="jobs"></div></section></main><script>
const el=id=>document.getElementById(id);async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
el('submit').onclick=async()=>{try{const d=await post('/api/transcribe',{audio:el('audio').value,backend:el('backend').value});el('result').textContent='已提交：'+d.job_id;poll()}catch(e){el('result').textContent=e.message}};
async function poll(){const d=await(await fetch('/api/jobs')).json();el('jobs').replaceChildren();for(const [id,j]of Object.entries(d).reverse()){if(j.kind!=='asr')continue;const p=document.createElement('p');p.textContent=id+' · '+j.status+(j.error?' · '+j.error:'');el('jobs').append(p);if(j.subtitle){for(const [text,url]of [['下载 SRT 字幕',j.subtitle],['查看识别文字与时间戳',j.transcript]]){const a=document.createElement('a');a.textContent=text+' ';a.href=url;a.target='_blank';el('jobs').append(a)}}}}
async function services(){const d=await(await fetch('/api/services')).json();el('services').textContent=`千问生图：${d.comfyui.ready?'就绪':'未启动'} · 配音：${d.tts.ready?'就绪':d.tts.starting?'正在加载':'未启动'}`}
async function tts(action){try{el('serviceMessage').textContent=(await post('/api/services/tts',{action})).message;services()}catch(e){el('serviceMessage').textContent=e.message}}poll();services();setInterval(poll,5000);setInterval(services,5000);
</script><script src="/assets/workbench.js"></script></html>
