<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品与工程 · AI STUDIO</title><link rel="stylesheet" href="/assets/workbench.css"><link rel="stylesheet" href="/assets/hub.css"><link rel="stylesheet" href="/assets/library.css"></head>
<body class="hub-page" data-workbench-services="true"><main><nav aria-label="工作台导航"><a href="/home">工作台</a><a href="/library">作品与工程</a><a href="/assets">资源库</a></nav><p id="services" hidden>检查服务状态…</p>
<header class="hub-section-head"><div><span class="hub-kicker">AI STUDIO / LIBRARY</span><h1 id="library-title">作品与工程</h1><p id="library-description">集中管理各个工具和工作流的成果，查看成片、试听声音，继续编辑已保存的工程。</p></div><div class="hub-actions"><a id="create-link" class="hub-button primary" href="/workflows">新建作品</a><button id="refresh-library" class="hub-button secondary">刷新</button></div></header>
<div id="project-tabs" class="hub-filter" aria-label="作品范围"><button data-status="done" aria-pressed="true">已完成作品</button><button data-status="all" aria-pressed="false">全部工程</button><button data-status="draft" aria-pressed="false">草稿</button><button data-status="preview" aria-pressed="false">预览</button><button data-status="error" aria-pressed="false">未完成任务</button></div>
<form id="library-filters" class="library-filters"><label class="library-search">搜索<input id="library-search" type="search" placeholder="名称、标签、创作来源" autocomplete="off"></label><label>内容类型<select id="library-kind"><option value="all">全部类型</option></select></label><label class="library-favorite"><input id="library-favorite" type="checkbox">只看收藏</label><button class="hub-button secondary" type="submit">查找</button></form>
<section id="gallery-upload" class="library-upload" hidden><label>导入参考图片 <input id="upload-image" type="file" accept="image/png,image/jpeg,image/webp"></label><span>支持 PNG、JPG、WebP，每张最多 12 MB。</span><p id="upload-message" role="status"></p></section>
<p id="library-status" role="status" aria-live="polite">正在读取…</p><div id="library-grid" class="library-grid"></div><p id="library-empty" class="hub-empty" hidden>这里暂时没有符合条件的内容。试试其他类型，或创建第一份作品。</p>
<footer class="hub-support"><a href="/assets">打开资源库</a> · <a href="/workflows">选择工作流</a></footer></main>
<dialog id="library-detail" aria-labelledby="detail-title"><form method="dialog" class="detail-close"><button aria-label="关闭详情">×</button></form><div id="detail-content"></div></dialog>
<script src="/assets/library.js"></script><script src="/assets/workbench.js"></script></body></html>
