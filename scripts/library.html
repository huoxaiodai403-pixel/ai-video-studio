<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品与工程 · AI STUDIO</title><link rel="stylesheet" href="/assets/workbench.css"><link rel="stylesheet" href="/assets/hub.css"><link rel="stylesheet" href="/assets/library.css"></head>
<body class="hub-page library-page" data-workbench-services="true"><main><nav aria-label="工作台导航"><a href="/home">工作台</a><a href="/library">作品与工程</a><a href="/assets">资源库</a></nav><p id="services" hidden>检查服务状态…</p>
<header class="hub-section-head library-heading"><div><span class="hub-kicker">创作归档</span><h1 id="library-title">作品与工程</h1><p id="library-description">预览成果，继续编辑，或把素材带入下一次创作。</p></div><div class="hub-actions"><a id="create-link" class="hub-button primary" href="/generation">新建作品</a><button id="refresh-library" type="button" class="hub-button secondary">刷新</button></div></header>
<div id="project-tabs" class="hub-filter" role="group" aria-label="作品范围"><button data-status="done" aria-pressed="true">已完成作品</button><button data-status="all" aria-pressed="false">全部工程</button><button data-status="draft" aria-pressed="false">草稿</button><button data-status="preview" aria-pressed="false">样片与预览</button><button data-status="running" aria-pressed="false">制作中</button><button data-status="queued" aria-pressed="false">排队中</button><button data-status="error" aria-pressed="false">失败任务</button></div>
<form id="library-filters" class="library-filters"><label class="library-search">搜索<input id="library-search" type="search" placeholder="作品名称、标签或创作来源" autocomplete="off"></label><label>内容类型<select id="library-kind"><option value="all">全部类型</option></select></label><label class="library-favorite"><input id="library-favorite" type="checkbox">只看收藏</label><div class="library-filter-actions"><button class="hub-button secondary" type="submit">查找</button><button id="clear-library-filters" class="library-text-button" type="button">清除筛选</button></div></form>
<section id="gallery-upload" class="library-upload" hidden><label>导入参考图片 <input id="upload-image" type="file" accept="image/png,image/jpeg,image/webp"></label><span>支持 PNG、JPG、WebP，每张最多 12 MB。</span><p id="upload-message" role="status"></p></section>
<div class="library-result-heading"><div><p id="library-status" role="status" aria-live="polite">正在读取…</p><p id="library-result-scope" class="library-result-scope"></p></div><button id="retry-library" class="hub-button secondary" type="button" hidden>重试本次筛选</button></div><div id="library-grid" class="library-grid" aria-label="作品列表"></div><section id="library-empty" class="library-empty" hidden><span class="library-empty-mark" aria-hidden="true">◇</span><h2 id="library-empty-title">还没有已完成作品</h2><p id="library-empty-description">可以继续已有工程，或开始一次新的创作。</p><div class="hub-actions"><button id="empty-reset-filters" class="hub-button secondary" type="button">清除筛选，查看全部</button><a id="empty-create-link" class="hub-button primary" href="/generation">新建作品</a></div></section>
<footer class="hub-support"><a href="/assets">打开资源库</a> · <a href="/workflows">选择工作流</a></footer></main>
<dialog id="library-detail" aria-labelledby="detail-title"><form method="dialog" class="detail-close"><button aria-label="关闭详情">×</button></form><div id="detail-content"></div></dialog>
<script src="/assets/library.js"></script><script src="/assets/workbench.js"></script></body></html>
