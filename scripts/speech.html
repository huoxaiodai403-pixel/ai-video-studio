<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音色克隆与配音 · AI 工作台</title>
<style>body{font:16px system-ui;background:#111820;color:#edf3fa;margin:0}main{max-width:1250px;margin:auto;padding:32px}h1{margin-bottom:6px}p{color:#a6b6c8}section{background:#1a2633;border:1px solid #344456;border-radius:12px;padding:22px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1.25fr;gap:22px}input,textarea,select,button{font:inherit;border-radius:7px;border:1px solid #4f667b;padding:10px;box-sizing:border-box}input,textarea,select{width:100%;background:#101a24;color:white;margin:7px 0 14px}textarea{min-height:120px}button{background:#82dbc5;color:#10201d;cursor:pointer;margin:5px 5px 5px 0}.case{display:block;width:100%;text-align:left;background:#24384b;color:white}.list{max-height:430px;overflow:auto}a{color:#85d9fb}.small{font-size:13px;color:#a6b6c8}img{max-width:100%;border-radius:8px}pre{white-space:pre-wrap}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/assets/workbench.css">
<link rel="stylesheet" href="/assets/controls.css"><link rel="stylesheet" href="/assets/online-services.css"><main><h1>音色克隆与配音</h1><p>选择本地或在线配音。先用短句试听，确认声音与字幕效果后再制作全片。</p><nav aria-label="工作台导航"><a href="/">插画与提示词</a> · <a href="/production">视频制作</a> · <a href="/motion">动态镜头</a> · <a href="/subtitles">语音转字幕</a> · <a href="http://127.0.0.1:8188" target="_blank" rel="noopener">ComfyUI</a> · <a href="/speech">音色克隆与配音</a> · <a href="/plan" target="_blank">部署方案</a> · <a href="/research" target="_blank">文章与项目参考</a> · <a href="/guide" target="_blank">使用说明</a> · <a href="/settings">在线接口设置</a></nav><p id="services" hidden>检查服务状态…</p>
<section><label>模型来源<select id="backend"><option value="local">本地模型 · IndexTTS / Qwen3-TTS</option><option value="online">在线模型 · 音色 ID，按厂商计费</option></select></label><p class="small">Windows 与 Edge 无需安装大型模型。在线服务和本地模型分别配置，各自保留设置。</p><label>配音文本<textarea id="text" placeholder="先用一两句话测试音色。"></textarea></label><div data-creation="voice"></div><p id="creation-status" role="status"></p><button id="submit">按所选音色生成配音</button><p id="result" role="status"></p></section><section><h2>配音任务与试听</h2><div id="jobs"></div></section></main><script src="/assets/creation.js"></script><script>const el=id=>document.getElementById(id);async function services(){try{const d=await Creation.api('/api/services');el('services').textContent=`千问生图：${d.comfyui.ready?'就绪':'未启动'} · 配音：${d.tts.ready?'就绪':d.tts.starting?'正在加载':'未启动'}`}catch(e){el('services').textContent=e.message}}async function tts(action){try{el('serviceMessage').textContent=(await Creation.api('/api/services/tts',{action})).message;services()}catch(e){el('serviceMessage').textContent=e.message}}services();setInterval(services,5000);
el('submit').onclick=async()=>{try{await Creation.ready;el('submit').disabled=true;const d=await Creation.api('/api/speech',{text:el('text').value,backend:el('backend').value,settings:Creation.read()});el('result').textContent='已提交：'+d.job_id;poll()}catch(e){el('result').textContent=e.message}finally{el('submit').disabled=false}};
const speechRows=new Map();let speechPolling=false;
async function poll(){
 if(speechPolling)return;speechPolling=true;
 try{
  const d=await Creation.api('/api/jobs'),rows=Object.entries(d).filter(([,j])=>j.kind==='speech').reverse();
  for(let index=0;index<rows.length;index++){
   const [id,j]=rows[index],signature=JSON.stringify([j.status,j.error||'',j.audio||'',j.voice_engine||'']);let row=speechRows.get(id);
   if(!row){
    const box=document.createElement('div'),p=document.createElement('p');box.dataset.jobId=id;box.append(p);
    row={box,p,signature:null,audio:null,audioUrl:null};speechRows.set(id,row);
    const next=rows.slice(index+1).find(([nextId])=>speechRows.has(nextId));
    el('jobs').insertBefore(box,next?speechRows.get(next[0]).box:null);
   }
   if(row.signature===signature)continue;
   row.p.textContent=id+' · '+j.status+(j.error?' · '+j.error:'');
   if(j.audio&&row.audioUrl!==j.audio){
    if(!row.audio){row.audio=document.createElement('audio');row.audio.controls=true;row.box.append(row.audio)}
    row.audio.src=j.audio;row.audioUrl=j.audio;
   }
   if(j.status==='done'&&j.voice_engine==='qwen3-design'&&j.audio&&!row.saveVoice){row.saveVoice=document.createElement('a');row.saveVoice.href='/voices?fromJob='+encodeURIComponent(id);row.saveVoice.textContent='保存为固定角色音色';row.saveVoice.style.display='block';row.saveVoice.style.margin='8px 0 16px';row.box.append(row.saveVoice)}
   if(j.status==='done'&&j.subtitle&&!row.subtitle){row.subtitle=document.createElement('a');row.subtitle.href=j.subtitle;row.subtitle.download='';row.subtitle.textContent='下载同步字幕 SRT';row.subtitle.style.display='block';row.box.append(row.subtitle)}
   row.signature=signature;
  }
 }catch(e){el('result').textContent='读取配音任务失败：'+e.message}finally{speechPolling=false}
}poll();setInterval(poll,5000);</script><script src="/assets/workbench.js"></script><script src="/assets/speech_voices.js"></script><script src="/assets/speech-picker.js"></script></html>
