<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配音 · AI 视频工作台</title>
<link rel="stylesheet" href="/assets/controls.css"><link rel="stylesheet" href="/assets/workbench.css"><link rel="stylesheet" href="/assets/tool-workspace.css"></head>
<body class="tool-page speech-page" data-speech-workspace="true"><main>
<header class="tool-heading"><div><h1>配音</h1><p>先用一两句话试听，确认声音后再制作完整旁白。</p></div><a href="/voices">打开音色库 →</a></header>
<div class="tool-layout">
<section class="tool-panel" aria-labelledby="input-heading"><div class="panel-heading"><h2 id="input-heading">配音文本</h2><p id="draft-state" class="draft-state" role="status">正在读取草稿…</p></div>
<form id="tool-form"><label for="text" class="small">想让声音说些什么？</label><textarea id="text" class="tool-text" required maxlength="4000" placeholder="输入旁白或角色台词。先用一小段试听，再调整语速与音色。"></textarea><p class="input-caption"><span>保留标点，让停顿更自然</span><span id="text-count">0 / 4000 字</span></p>
<label class="tool-source">配音来源<select id="backend"><option value="windows">Windows 系统语音 · CPU</option></select></label>
<div class="tool-submit"><button id="submit" type="submit" disabled class="primary">生成配音与字幕</button><p class="small" id="output-summary">生成后在右侧试听</p></div><p id="result" class="tool-feedback" role="status"></p><p id="action-help" class="small" hidden></p>
<details id="voice-settings" class="tool-details" hidden><summary>本地音色与克隆参数 <span class="small">只影响本次配音</span></summary><fieldset id="voice-fields" class="detail-content" disabled><div data-creation="voice"></div><p id="creation-status" class="tool-feedback" role="status"></p></fieldset></details>
</form></section>
<section class="tool-panel tool-result" id="current-result" tabindex="-1" aria-labelledby="result-heading"><div class="panel-heading"><h2 id="result-heading">当前试听</h2><span id="job-state" class="job-state" role="status">等待生成</span></div><p id="job-origin"></p><div class="result-surface"><div id="job-media"></div><p id="job-empty">生成后在这里试听，下载声音与字幕。</p></div><div id="job-actions"></div><p id="job-error" role="status"></p><p id="job-note" role="status"></p><p id="job-poll-status" role="status"></p><div class="job-footer"><p class="small">试听语气、停顿与发音，满意后再用于视频。</p><div class="result-history"><label>近期配音<select id="job-history" aria-label="近期配音结果"></select></label><a href="/library?kind=speech&status=all">全部作品 →</a></div><span id="job-id"></span></div></section>
</div></main>
<script src="/assets/creation.js"></script><script src="/assets/tool-draft-state.js"></script><script src="/assets/tool-workspace.js"></script><script src="/assets/speech_voices.js"></script><script src="/assets/speech-picker.js"></script><script src="/assets/speech-page.js"></script><script src="/assets/workbench.js"></script>
</body></html>
