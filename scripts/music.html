<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音乐与音效 · AI 视频工作台</title>
<link rel="stylesheet" href="/assets/controls.css"><link rel="stylesheet" href="/assets/workbench.css"><link rel="stylesheet" href="/assets/tool-workspace.css"></head>
<body class="tool-page music-page" data-tool="music"><main><header class="tool-heading"><div><h1>音乐与音效</h1><p>制作纯音乐或短音效，试听后用于你的影片。</p></div><a href="/library">全部作品 →</a></header>
<div class="tool-layout"><section class="tool-panel" aria-labelledby="input-heading"><div class="panel-heading"><h2 id="input-heading">声音描述</h2><p id="draft-state" class="draft-state" role="status">正在读取草稿…</p></div><label>声音来源<select id="audio-mode"><option value="reuse">使用已有音频 · 无需模型</option><option value="generate">本地模型生成</option></select></label><form id="tool-form"><div id="music-local" data-edition="full"><label id="prompt-label" for="prompt">音乐描述</label><textarea id="prompt" class="tool-text" minlength="5" maxlength="1900" required placeholder="描述情绪、乐器与节奏，例如：柔和钢琴和轻氛围铺底，平静克制，为旁白留出空间。"></textarea><p class="input-caption"><span id="mode-note">纯音乐 · 生成后先试听</span><span id="text-count"></span></p><div class="control-grid"><label>音频引擎<select id="engine"><option value="ace-step-1.5">ACE-Step 1.5 · 配乐</option><option value="stable-audio-3-sfx">Stable Audio 3 · CPU 音效</option></select></label><label id="music-duration-label">配乐时长<select id="duration"><option value="30">30 秒</option><option value="45">45 秒</option><option value="60">60 秒</option></select></label><label id="sfx-duration-label" hidden>音效时长<input id="sfx-duration" type="number" min="1" max="15" step="1" value="5"></label></div><div class="tool-submit"><button id="generate" type="submit" disabled class="primary">生成配乐</button><p id="output-summary" class="small">正在检查音频引擎…</p></div><p id="result" class="tool-feedback" role="status"></p><details class="tool-details"><summary>描述模板与节奏</summary><div class="detail-content"><div id="music-templates" class="tool-presets"><button type="button" class="secondary" data-template="calm">平静解说</button><button type="button" class="secondary" data-template="suspense">悬疑调查</button><button type="button" class="secondary" data-template="science">轻松科普</button></div><div id="sfx-templates" class="tool-presets" hidden><button type="button" class="secondary" data-template="transition">转场轻响</button><button type="button" class="secondary" data-template="paper">纸张翻动</button><button type="button" class="secondary" data-template="ambience">环境氛围</button></div><p id="template-note" class="small"></p><div class="control-grid"><label id="bpm-label">节拍速度 BPM<input id="bpm" type="number" min="40" max="180" step="1" value="72" required></label><label>随机种子<input id="seed" type="number" min="0" max="2147483647" step="1" value="42" required></label></div></div></details><details id="engine-details-panel" class="tool-details"><summary>引擎状态</summary><div class="detail-content"><p id="engine-status" role="status"></p><ul id="engine-details" class="small"></ul><button id="refresh-engine" class="secondary" type="button">重新检查</button></div></details></div>
<div id="music-friend" hidden><p class="small">选择已有配乐或音效，试听后用于视频；需要生成时可切换至本地模型。</p><div class="compact-row"><label>从资源库选择<select id="source-library"><option value="">正在读取素材…</option></select></label><button id="refresh-source" class="secondary" type="button">刷新</button></div><p id="source-status" class="small" role="status"></p><label>音频完整路径<input id="audio-path"  placeholder="选择素材，或填写已有配乐的完整路径"></label><div id="source-preview" class="source-preview" hidden></div><div class="tool-submit"><button id="copy-source" type="button" class="secondary">复制音频路径</button><a href="/audio-library">打开音频资源库 →</a></div><p id="friend-status" class="tool-feedback" role="status"></p><p class="small"><a href="/investigation">在调查长片中使用背景音乐 →</a></p></div></form></section>
<section class="tool-panel tool-result" id="current-result" tabindex="-1" aria-labelledby="result-heading"><div class="panel-heading"><h2 id="result-heading">当前试听</h2><span id="job-state" class="job-state" role="status">等待生成</span></div><p id="job-origin"></p><div class="result-surface"><div id="job-media"></div><p id="job-empty"></p></div><div id="job-actions"></div><p id="job-error" role="status"></p><p id="job-note" role="status"></p><p id="job-poll-status" role="status"></p><div class="job-footer"><p class="small">先试听，确认节奏、音量与人声空间；音频路径可在长片素材登记中复用。</p><div class="result-history"><label>近期任务<select id="job-history" aria-label="近期任务"></select></label><a href="/library?status=all">全部作品 →</a></div><span id="job-id"></span></div></section></div></main>
<script src="/assets/creation.js"></script><script src="/assets/tool-draft-state.js"></script><script src="/assets/tool-workspace.js"></script><script src="/assets/music.js"></script><script src="/assets/workbench.js"></script></body></html>
