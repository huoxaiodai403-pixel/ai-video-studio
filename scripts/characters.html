<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色库 · AI STUDIO</title><link rel="stylesheet" href="/assets/workbench.css"><link rel="stylesheet" href="/assets/generation.css"><link rel="stylesheet" href="/assets/characters.css"></head>
<body><main><header class="generation-heading"><div><h1>角色库</h1><p>让外貌、服装、参考图和声音跟随角色，在不同镜头与章节继续使用。</p></div><button type="button" id="new-character" class="secondary">新建角色</button></header>
<p id="character-feedback" role="status"></p><div class="characters-workspace"><section aria-label="已保存角色"><label>筛选作品或角色<input id="character-search" type="search" placeholder="角色名、所属作品"></label><div id="character-list" class="character-list"></div></section>
<section class="generation-panel" aria-labelledby="character-editor-title"><h2 id="character-editor-title">新角色</h2><form id="character-form"><div class="generation-fields"><label>角色名称<input id="character-name" maxlength="32" required></label><label>所属作品 / 系列<input id="character-project" maxlength="120" placeholder="例如：雨夜书店"></label><label class="wide">外貌与识别特征<textarea id="character-appearance" maxlength="3000" rows="3" placeholder="年龄段、面部、发型、体型和不能改变的特征"></textarea></label><label class="wide">服装与配色<textarea id="character-wardrobe" maxlength="1500" rows="2"></textarea></label><label class="wide">角色关系与连续性备注<textarea id="character-notes" maxlength="3000" rows="2"></textarea></label><label>绑定音色<select id="character-voice"><option value="">使用全片旁白</option></select></label><div class="generation-actions"><a href="/voices">选择 / 设计音色 →</a></div><label class="wide">参考图（最多四张，可多选）<select id="character-references" multiple size="4" aria-describedby="reference-help"></select></label><p id="reference-help" class="small wide">优先使用同一角色的正面、侧面和全身图。角色参考会复制到任务快照；修改角色库不会改变已提交的任务。</p><label class="wide">导入角色参考图<input id="character-upload" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="wide generation-actions"><a href="/image">用 ComfyUI / 在线服务生成人物图 →</a><a href="/gallery">打开图库 →</a></div></div><div class="generation-actions"><button id="save-character" class="primary" type="submit">保存角色</button><button type="button" class="secondary" id="reset-character">恢复已保存版本</button><button type="button" class="quiet" id="restore-character-draft" hidden>恢复刚才的输入</button><a href="/generation?route=character-story">带入新故事 →</a><a href="/novel">小说转漫剧</a><a href="/investigation">长片制作</a></div><p class="small">每次保存保留旧版本。生成时固定本次角色与音色；人物一致性仍需逐镜审看。</p></form></section></div></main><script src="/assets/workbench.js"></script><script src="/assets/characters.js"></script></body></html>
