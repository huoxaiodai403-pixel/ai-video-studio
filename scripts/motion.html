<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>短镜头 · AI 视频工作台</title>
<link rel="stylesheet" href="/assets/controls.css"><link rel="stylesheet" href="/assets/workbench.css"><link rel="stylesheet" href="/assets/tool-workspace.css"></head>
<body class="tool-page motion-page" data-tool="motion"><main><header class="tool-heading"><div><h1>短镜头</h1><p>用首帧和动作描述，制作可复用的视频片段。</p></div><a href="/library">全部作品 →</a></header>
<div class="tool-layout"><section class="tool-panel" aria-labelledby="input-heading"><div class="panel-heading"><h2 id="input-heading">镜头描述</h2><p id="draft-state" class="draft-state" role="status">正在读取草稿…</p></div><form id="tool-form"><label for="motionPrompt">动作与运镜</label><textarea id="motionPrompt" class="tool-text" required maxlength="5000" placeholder="例如：女孩轻轻回头，微风吹动发丝。镜头缓慢推近，保持自然柔和的光线。"></textarea><p class="input-caption"><span>一个镜头，集中描述一个主要动作</span><span id="text-count">0 / 5000 字</span></p>
<div class="tool-source"><label>生成来源<select id="backend"><option value="local">本地模型</option><option value="online">在线服务 · 按服务商计费</option></select></label></div><div class="tool-submit"><button id="submit" type="submit" class="primary" disabled>生成短镜头</button><p id="output-summary" class="small">正在读取本次参数…</p></div><p id="result" class="tool-feedback" role="status"></p><p id="action-help" class="small" hidden></p>
<details class="tool-details" id="source-details"><summary>首帧图片 <span class="small" id="source-summary">可选 · A14B 必填</span></summary><div class="detail-content"><div class="compact-row"><label>从资源库选择<select id="source-library"><option value="">正在读取素材…</option></select></label><button id="refresh-source" class="secondary" type="button">刷新</button></div><p id="source-status" class="small" role="status"></p><label>首帧图片完整路径<input id="image"  placeholder="从资源库选择，或粘贴本机 PNG / JPG / WebP 路径"></label><div id="source-preview" class="source-preview" hidden></div><p class="small"><a href="/image">先创作一张图像 →</a></p></div></details>
<details class="tool-details" id="motion-settings"><summary>本地尺寸与时长 <span id="settings-summary" class="small"></span></summary><div class="detail-content"><div data-creation="motion"></div><button id="tested-portrait" class="secondary" type="button">填入竖屏参数 · 480 × 640 / 约 5 秒</button><p id="creation-status" class="tool-feedback" role="status"></p><p class="small">本次参数独立保存；实测预设保留引擎和随机种子。</p><a href="/models" data-edition="full">管理本地模型 →</a></div></details>
<details class="tool-details"><summary>运镜与使用提示</summary><div class="detail-content"><p class="small">在线请求使用服务设置中的模型，时长请求为 4 秒。先验证单镜头的人物一致性与动作效果，再用于整片。</p><a href="/director">打开运镜词典 →</a><a href="/settings?service=video">配置在线视频服务 →</a></div></details></form></section>
<section class="tool-panel tool-result" id="current-result" tabindex="-1" aria-labelledby="result-heading"><div class="panel-heading"><h2 id="result-heading">当前镜头</h2><span id="job-state" class="job-state" role="status">等待生成</span></div><p id="job-origin"></p><div class="result-surface"><div id="job-media"></div><p id="job-empty"></p></div><div id="job-actions"></div><p id="job-error" role="status"></p><p id="job-note" role="status"></p><p id="job-poll-status" role="status"></p><div class="job-footer"><p class="small">先检查人物、动作与运镜，再下载用于整片。</p><div class="result-history"><label>近期任务<select id="job-history" aria-label="近期任务"></select></label><a href="/library?status=all">全部作品 →</a></div><span id="job-id"></span></div></section></div></main>
<script src="/assets/creation.js"></script><script src="/assets/tool-draft-state.js"></script><script src="/assets/tool-workspace.js"></script><script src="/assets/media-tool.js"></script><script src="/assets/workbench.js"></script></body></html>
